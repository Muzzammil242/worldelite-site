<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: #07070a;
    color: #efe9df;
    font-family: 'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .glow {
    position: fixed; z-index: 1; pointer-events: none;
    left: 50%; top: -22vh; transform: translateX(-50%);
    width: min(1200px, 150vw); height: min(1200px, 150vw);
    background: radial-gradient(circle, rgba(212,169,78,.15) 0%, rgba(212,169,78,.05) 35%, transparent 68%);
  }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.65) 100%);
  }

  main {
    position: relative; z-index: 2;
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: clamp(28px, 5vh, 56px) 24px clamp(18px, 3vh, 32px);
  }

  .mark { width: 68px; height: 44px; margin-bottom: clamp(14px, 2.6vh, 26px); animation: rise .9s .1s cubic-bezier(.2,.7,.3,1) both; }
  .mark path, .mark circle { fill: #d4a94e; }

  .wordmark {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 4.6rem);
    letter-spacing: .22em;
    text-indent: .22em;
    line-height: 1.05;
    margin: 0;
    color: #f4eddf;
    animation: rise .9s .22s cubic-bezier(.2,.7,.3,1) both;
  }

  .rule {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin: 20px 0 0; width: min(420px, 82vw);
    animation: rise .9s .34s cubic-bezier(.2,.7,.3,1) both;
  }
  .rule::before, .rule::after {
    content: ""; height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, rgba(212,169,78,.55), transparent);
  }
  .rule span {
    font-size: .62rem; letter-spacing: .42em; text-indent: .42em;
    text-transform: uppercase; color: #c9a862; white-space: nowrap;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 300; font-style: italic;
    font-size: clamp(1.35rem, 4.4vw, 2.3rem);
    line-height: 1.35; margin: clamp(24px, 3.8vh, 38px) 0 0; max-width: 20ch;
    color: #efe9df;
    animation: rise .9s .46s cubic-bezier(.2,.7,.3,1) both;
  }

  .lede {
    margin: 22px auto 0; max-width: 46ch;
    font-size: clamp(.92rem, 2.4vw, 1.02rem);
    line-height: 1.75; color: #9d9689; font-weight: 300;
    animation: rise .9s .58s cubic-bezier(.2,.7,.3,1) both;
  }

  .regions {
    display: flex; align-items: center; justify-content: center;
    gap: 18px; margin-top: clamp(20px, 3.4vh, 34px); flex-wrap: wrap;
    font-size: .66rem; letter-spacing: .3em; text-indent: .3em;
    text-transform: uppercase; color: #7d7669;
    animation: rise .9s .68s cubic-bezier(.2,.7,.3,1) both;
  }
  .regions i { display: block; width: 3px; height: 3px; border-radius: 50%; background: #d4a94e; opacity: .8; }

  .cta {
    margin-top: clamp(26px, 4.2vh, 42px);
    animation: rise .9s .8s cubic-bezier(.2,.7,.3,1) both;
  }
  .cta span {
    display: inline-block;
    padding: 13px 32px;
    border: 1px solid rgba(212,169,78,.3);
    color: #c9a862;
    font-size: .64rem; letter-spacing: .34em; text-indent: .34em; text-transform: uppercase;
  }

  footer {
    position: relative; z-index: 2;
    padding: clamp(16px, 2.4vh, 30px) 24px clamp(18px, 3vh, 34px); text-align: center;
    font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: #55504a;
    animation: rise .9s 1s cubic-bezier(.2,.7,.3,1) both;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .mark, .wordmark, .rule, h1, .lede, .regions, .cta, footer { animation: none; opacity: 1; }
  }
  @media (max-width: 480px) {
    .wordmark { letter-spacing: .16em; text-indent: .16em; }
    .regions { gap: 12px; }
  }
</style>

<body>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main>
  <svg class="mark" viewBox="0 0 68 44" aria-hidden="true">
    <path d="M6 16 L14 34 L20 20 L26 34 L34 16 L30.5 16 L25.6 27.4 L20 14.5 L14.4 27.4 L9.5 16 Z"/>
    <path d="M34 16 L42 34 L48 20 L54 34 L62 16 L58.5 16 L53.6 27.4 L48 14.5 L42.4 27.4 L37.5 16 Z"/>
    <circle cx="34" cy="9" r="2.6"/>
    <circle cx="6" cy="12" r="1.8"/>
    <circle cx="62" cy="12" r="1.8"/>
  </svg>

  <p class="wordmark">WORLD ELITE</p>

  <div class="rule"><span>Real Estate &amp; Lifestyle</span></div>

  <h1>Something exceptional is coming.</h1>

  <p class="lede">
    A private network for extraordinary property — where owners, partners and
    promoters meet across the world's most desirable coastlines.
  </p>

  <div class="regions">
    <span>Mediterranean</span><i></i><span>Caribbean</span>
  </div>

  <div class="cta">
    <span>By Invitation Only</span>
  </div>
</main>

<footer>&copy; 2026 World Elite. All rights reserved.</footer>

<script>
(function () {
  var c = document.getElementById('stars'),
      x = c.getContext('2d'),
      reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches,
      stars = [], w, h, dpr;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.clientWidth || window.innerWidth;
    h = c.clientHeight || window.innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function build() {
    var n = Math.round((w * h) / 5200);
    n = Math.max(90, Math.min(n, 420));
    stars = [];
    for (var i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.1 + 0.25,
        a: Math.random() * 0.55 + 0.12,
        s: Math.random() * 0.011 + 0.003,
        p: Math.random() * Math.PI * 2,
        d: Math.random() * 0.02 + 0.004
      });
    }
  }

  function paint(t) {
    x.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var tw = reduce ? st.a : st.a + Math.sin(t * st.s + st.p) * 0.28;
      if (tw < 0.04) tw = 0.04;
      x.beginPath();
      x.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      x.fillStyle = 'rgba(255,250,238,' + tw.toFixed(3) + ')';
      x.fill();
      if (!reduce) {
        st.y -= st.d;
        if (st.y < -2) { st.y = h + 2; st.x = Math.random() * w; }
      }
    }
    requestAnimationFrame(paint);
  }

  window.addEventListener('resize', size, { passive: true });
  window.addEventListener('load', size);
  size();
  requestAnimationFrame(paint);
})();
</script>

</body>
